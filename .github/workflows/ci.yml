name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @omg/web exec astro check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm validate:data
      - run: pnpm build
        env:
          SITE_URL: https://cjrutherford.github.io
          BASE_PATH: /opencode-model-guide
      - run: pnpm tsx scripts/check-links.ts
        env:
          BASE_PATH: /opencode-model-guide

  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false
      - run: pnpm install --frozen-lockfile
      - name: Build sandbox image
        run: pnpm eval:build-image 2>&1 | tee eval-build.log
      - name: Verify corpus
        run: pnpm eval:verify-corpus 2>&1 | tee eval-verify.log
      - name: Upload corpus logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eval-corpus-logs
          path: |
            eval-build.log
            eval-verify.log
          if-no-files-found: ignore
          retention-days: 7
